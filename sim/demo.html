<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1d23">
<title>Actuator Sim (demo)</title>
<style>
  :root {
    --bg: #1a1d23;
    --panel: #232831;
    --panel-2: #2a3140;
    --ink: #e6e8ec;
    --dim: #8b94a3;
    --accent: #4cc3ff;
    --good: #5ad17a;
    --warn: #ffb454;
    --bad: #ff6b6b;
    --board: #c9a26a;
    --arm: #6b7c93;
    --cup: #c25450;
    --vacuum: #4cc3ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: contain; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
  }
  h1 { margin: 0 0 12px; font-weight: 500; font-size: 17px; letter-spacing: 0.5px;
       display: flex; align-items: center; gap: 8px; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    background: #5a4830; color: var(--warn); font-size: 10px; letter-spacing: 1px;
    font-weight: 600; text-transform: uppercase;
  }
  .controls {
    display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
  }
  button {
    background: var(--panel-2); color: var(--ink); border: 1px solid #3a4254;
    border-radius: 6px; padding: 10px 14px; font-size: 14px;
    cursor: pointer; font-family: inherit; flex: 1; min-height: 44px;
  }
  button:active { background: #344057; }
  button.primary { background: #2a6f9c; border-color: #3a8fc4; }
  button.danger  { background: #6f3030; border-color: #a04848; }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 880px) {
    .grid { grid-template-columns: 320px 1fr 300px; }
  }
  .panel {
    background: var(--panel); border-radius: 10px; padding: 12px;
    border: 1px solid #2c333f;
  }
  .panel h2 {
    margin: 0 0 8px; font-size: 11px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; color: var(--dim);
  }
  .state-box {
    background: var(--panel-2); border: 1px solid #353c4a;
    border-radius: 6px; padding: 7px 10px; margin: 4px 0;
    transition: background 200ms, border-color 200ms;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
  }
  .state-box.active {
    background: linear-gradient(90deg, #2a6f9c 0%, #2a4863 100%);
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(76, 195, 255, 0.4);
    color: #fff;
  }

  .readout-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px solid #2c333f;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    gap: 8px;
  }
  .readout-row:last-child { border-bottom: 0; }
  .readout-row .label { color: var(--dim); flex-shrink: 0; }
  .readout-row .value { font-weight: 500; text-align: right; }
  .bar {
    height: 6px; background: #1a1d23; border-radius: 3px; overflow: hidden;
    margin-top: 2px; width: 100px;
  }
  .bar-fill { height: 100%; background: var(--accent); transition: width 100ms; }
  .bar-fill.fsr { background: var(--warn); }
  .bar-fill.vacuum { background: var(--vacuum); }
  .pill {
    padding: 2px 7px; border-radius: 10px; font-size: 10px;
    background: #1a1d23; color: var(--dim); display: inline-block;
    margin-left: 4px;
  }
  .pill.on  { background: var(--good); color: #1a1d23; }
  .pill.off { background: #3a3a3a; color: var(--dim); }

  .stage {
    background: var(--panel); border-radius: 10px; padding: 12px;
    border: 1px solid #2c333f; position: relative;
  }
  .stage svg { width: 100%; height: 380px; display: block; }
  @media (min-width: 880px) {
    .stage svg { height: 480px; }
  }

  #log {
    margin-top: 14px; background: #14171c; border: 1px solid #2c333f;
    border-radius: 8px; padding: 8px;
    height: 120px; overflow-y: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; color: #b5bcc8; white-space: pre-wrap;
  }
  .legend { display: flex; gap: 10px; margin-top: 6px; font-size: 10px;
            color: var(--dim); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>

<h1>Actuator Simulator <span class="badge">demo</span></h1>

<div class="controls">
  <button class="primary" id="btn-start">Start</button>
  <button id="btn-stop">Stop</button>
  <button class="danger" id="btn-reset">Reset</button>
</div>

<div class="grid">

  <div class="panel">
    <h2>State machine</h2>
    <div id="states"></div>
  </div>

  <div class="stage">
    <h2>Mechanical view</h2>
    <svg viewBox="0 0 360 480" preserveAspectRatio="xMidYMid meet">
      <g id="board">
        <ellipse cx="180" cy="92" rx="170" ry="14" fill="#a07c47" />
        <ellipse cx="180" cy="88" rx="170" ry="14" fill="var(--board)" />
        <text x="180" y="68" text-anchor="middle" fill="var(--dim)" font-size="10" letter-spacing="2">SURFBOARD BLANK</text>
      </g>
      <g id="base">
        <rect x="120" y="430" width="120" height="40" rx="3" fill="#3a4254" />
        <rect x="135" y="438" width="90" height="6" fill="#1a1d23" />
        <text x="180" y="462" text-anchor="middle" fill="var(--dim)" font-size="9" letter-spacing="2">ACTUATOR BASE</text>
      </g>
      <g id="arm-group">
        <rect id="arm-shaft" x="170" y="200" width="20" height="230" fill="var(--arm)" stroke="#2a3140" stroke-width="1" />
        <rect id="arm-head" x="155" y="195" width="50" height="10" fill="#8a9bb0" />
        <circle id="fsr-dot" cx="180" cy="190" r="6" fill="#444" stroke="#222" stroke-width="1" />
        <g id="cup-group">
          <ellipse id="cup" cx="180" cy="180" rx="22" ry="7" fill="var(--cup)" />
          <rect id="cup-stem" x="177" y="180" width="6" height="10" fill="#8a3a36" />
        </g>
        <ellipse id="vacuum-aura" cx="180" cy="92" rx="34" ry="14" fill="none"
                 stroke="var(--vacuum)" stroke-width="2" stroke-dasharray="3 3" opacity="0" />
      </g>
      <text id="state-label" x="180" y="30" text-anchor="middle" fill="var(--accent)"
            font-family="ui-monospace, monospace" font-size="14" font-weight="600">STOPPED</text>
      <text id="motor-label" x="180" y="48" text-anchor="middle" fill="var(--dim)"
            font-family="ui-monospace, monospace" font-size="11">motor: STOPPED</text>
    </svg>
    <div class="legend">
      <span><span class="swatch" style="background: var(--arm);"></span> Arm</span>
      <span><span class="swatch" style="background: var(--cup);"></span> Cup</span>
      <span><span class="swatch" style="background: var(--board);"></span> Board</span>
      <span><span class="swatch" style="background: var(--vacuum);"></span> Vacuum</span>
    </div>
  </div>

  <div class="panel">
    <h2>Live readouts</h2>
    <div class="readout-row"><span class="label">State</span><span class="value" id="r-state">STOPPED</span></div>
    <div class="readout-row"><span class="label">Motor</span><span class="value" id="r-motor">STOPPED</span></div>
    <div class="readout-row"><span class="label">Arm</span><span class="value" id="r-arm">0.0 / 50.0</span></div>
    <div class="readout-row">
      <span class="label">FSR</span>
      <span class="value"><span id="r-fsr">0%</span>
        <div class="bar"><div class="bar-fill fsr" id="bar-fsr" style="width:0%"></div></div>
      </span>
    </div>
    <div class="readout-row">
      <span class="label">Cup</span>
      <span class="value">
        <span id="pill-cup-sol" class="pill off">SOL OFF</span>
        <span id="pill-cup-pos" class="pill off">LOWERED</span>
      </span>
    </div>
    <div class="readout-row">
      <span class="label">Cup deploy</span>
      <span class="value"><span id="r-cup">0%</span>
        <div class="bar"><div class="bar-fill" id="bar-cup" style="width:0%"></div></div>
      </span>
    </div>
    <div class="readout-row">
      <span class="label">Vac solenoid</span>
      <span class="value"><span id="pill-vac-sol" class="pill off">OFF</span></span>
    </div>
    <div class="readout-row">
      <span class="label">Vacuum</span>
      <span class="value"><span id="r-vac">0%</span>
        <div class="bar"><div class="bar-fill vacuum" id="bar-vac" style="width:0%"></div></div>
      </span>
    </div>
    <div class="readout-row">
      <span class="label">Pressure</span>
      <span class="value"><span id="pill-vac-sw" class="pill off">NO VACUUM</span></span>
    </div>
  </div>

</div>

<div id="log" aria-live="polite"></div>

<script>
/*
 * Self-contained demo. Mocks the same JSON snapshots the real sim_bin
 * emits over SSE, but generates them in JavaScript so the page works
 * with no server. The numeric tunings match sim/physics.cpp so the
 * cycle looks identical to the native build.
 */

const TICK_MS = 30;          // a little faster than the firmware's 20 ms
                             // so the demo doesn't drag on phone
const BOARD = 50.0;
const ARM_MIN = 0.0;
const ARM_MAX = 65.0;
const FAST   = 1.5;          // units per tick
const SLOW   = 0.15;
const FSR_PER_UNIT = 90.0;
const CUP_RATE = 6.0;        // %/tick
const VAC_BUILD = 4.0;
const VAC_DECAY = 6.0;
const VAC_THRESH = 60.0;
const CUP_RAISED_THRESH = 90.0;

const LOWER_THRESHOLD_PCT = 10;   // SavedData defaults
const UPPER_THRESHOLD_PCT = 20;

// Firmware's tick-based fallback timeouts (from ActuatorStateMachine.h):
//   kAtBoardSettleTicks = 20
//   kRaisingCupTimeoutTicks = 400  (~8 s at 20 ms)
//   kApplyingVacuumTimeoutTicks = 400
// We use shortened versions for the demo so a phone user doesn't have to
// stare at the page for 16+ seconds.
const AT_BOARD_SETTLE_TICKS    = 15;
const RAISING_CUP_TIMEOUT      = 60;
const APPLYING_VACUUM_TIMEOUT  = 80;

const STATES = ["STOPPED","DRIVING_UP","BOARD_SENSED","TUNING_DOWN",
                "TUNING_UP","AT_BOARD","RAISING_CUP","APPLYING_VACUUM",
                "IN_POSITION","DRIVING_DOWN","ERROR"];

// ---- physics model state ----
let armPos = 0, cupDeploy = 0, vacuumLevel = 0;
let cupSolenoid = false, vacSolenoid = false;
let state = "STOPPED";
let prevState = "STOPPED";
let atBoardTicks = 0, raisingTicks = 0, vacuumTicks = 0;
let startPending = false, stopPending = false;

function fsr() {
  const compression = Math.max(0, armPos - BOARD);
  return Math.min(100, (compression * FSR_PER_UNIT * 100) / 1023);
}
function cupRaised() { return cupDeploy >= CUP_RAISED_THRESH; }
function hasVacuum() { return vacuumLevel >= VAC_THRESH; }
function motorFromState() {
  switch (state) {
    case "DRIVING_UP":      return "UP_FAST";
    case "TUNING_UP":       return "UP_SLOW";
    case "TUNING_DOWN":     return "DOWN_SLOW";
    case "DRIVING_DOWN":    return "DOWN_FAST";
    default:                return "STOPPED";
  }
}

function step() {
  prevState = state;
  // ---- state transitions (mirrors ActuatorStateMachine::Process) ----
  switch (state) {
    case "STOPPED":
      cupSolenoid = false; vacSolenoid = false;
      if (startPending) state = "DRIVING_UP";
      break;
    case "DRIVING_UP":
      if (fsr() > UPPER_THRESHOLD_PCT) state = "TUNING_DOWN";
      else if (fsr() > LOWER_THRESHOLD_PCT) state = "BOARD_SENSED";
      break;
    case "BOARD_SENSED":
      if (fsr() > UPPER_THRESHOLD_PCT) state = "TUNING_DOWN";
      else if (fsr() > LOWER_THRESHOLD_PCT) state = "AT_BOARD";
      break;
    case "TUNING_DOWN":
      if (fsr() <= LOWER_THRESHOLD_PCT) state = "TUNING_UP";
      else if (fsr() <= UPPER_THRESHOLD_PCT) state = "AT_BOARD";
      break;
    case "TUNING_UP":
      if (fsr() > UPPER_THRESHOLD_PCT) state = "TUNING_DOWN";
      else if (fsr() > LOWER_THRESHOLD_PCT) state = "AT_BOARD";
      break;
    case "AT_BOARD":
      if (atBoardTicks++ >= AT_BOARD_SETTLE_TICKS) state = "RAISING_CUP";
      break;
    case "RAISING_CUP":
      cupSolenoid = true;
      if (raisingTicks++ >= RAISING_CUP_TIMEOUT) state = "APPLYING_VACUUM";
      break;
    case "APPLYING_VACUUM":
      vacSolenoid = true;
      if (vacuumTicks++ >= APPLYING_VACUUM_TIMEOUT) state = "IN_POSITION";
      break;
    case "IN_POSITION":
      cupSolenoid = false;
      if (startPending) state = "DRIVING_DOWN";
      break;
    case "DRIVING_DOWN":
      vacSolenoid = false;
      if (startPending || armPos <= ARM_MIN + 0.1) state = "STOPPED";
      break;
  }
  startPending = false;
  // (stopPending currently mirrors Start; the firmware's stop button is
  // wired but Process() doesn't act on it, so we leave it as a no-op.)
  stopPending = false;

  if (state !== prevState) {
    atBoardTicks = 0; raisingTicks = 0; vacuumTicks = 0;
    appendLog(`Transitioning State from ${prevState} to ${state}. FSR = ${fsr().toFixed(1)}%`);
  }

  // ---- physics integration ----
  switch (motorFromState()) {
    case "UP_FAST":   armPos += FAST; break;
    case "UP_SLOW":   armPos += SLOW; break;
    case "DOWN_FAST": armPos -= FAST; break;
    case "DOWN_SLOW": armPos -= SLOW; break;
  }
  armPos = Math.max(ARM_MIN, Math.min(ARM_MAX, armPos));

  cupDeploy += cupSolenoid ? CUP_RATE : -CUP_RATE;
  cupDeploy = Math.max(0, Math.min(100, cupDeploy));

  const sealed = vacSolenoid && cupRaised() && armPos >= BOARD - 1;
  vacuumLevel += sealed ? VAC_BUILD : -VAC_DECAY;
  vacuumLevel = Math.max(0, Math.min(100, vacuumLevel));

  render();
}

// ---- DOM ----
const stateContainer = document.getElementById("states");
const stateNodes = {};
STATES.forEach(name => {
  const box = document.createElement("div");
  box.className = "state-box";
  box.id = "state-" + name;
  box.textContent = name;
  stateContainer.appendChild(box);
  stateNodes[name] = box;
});

const armShaft = document.getElementById("arm-shaft");
const armHead = document.getElementById("arm-head");
const cupEl = document.getElementById("cup");
const cupStem = document.getElementById("cup-stem");
const fsrDot = document.getElementById("fsr-dot");
const vacuumAura = document.getElementById("vacuum-aura");
const stateLabel = document.getElementById("state-label");
const motorLabel = document.getElementById("motor-label");
const logEl = document.getElementById("log");
let lastRenderedState = null;

function fsrColor(pct) {
  if (pct < 8) return "#555";
  if (pct < 18) return "#5ad17a";
  if (pct < 25) return "#4cc3ff";
  return "#ff6b6b";
}
function appendLog(text) {
  logEl.textContent += text + "\n";
  const lines = logEl.textContent.split("\n");
  if (lines.length > 80) logEl.textContent = lines.slice(-80).join("\n");
  logEl.scrollTop = logEl.scrollHeight;
}

function render() {
  const yBase = 430;
  const yPerUnit = (430 - 130) / 65;
  const shaftTop = yBase - armPos * yPerUnit;
  armShaft.setAttribute("y", shaftTop);
  armShaft.setAttribute("height", (yBase - shaftTop).toString());
  armHead.setAttribute("y", (shaftTop - 5).toString());
  fsrDot.setAttribute("cy", (shaftTop - 10).toString());
  fsrDot.setAttribute("fill", fsrColor(fsr()));

  const cupBaseY = shaftTop - 15;
  const cupBoardY = 85;
  const cupY = cupBaseY + (cupBoardY - cupBaseY) * (cupDeploy / 100);
  cupEl.setAttribute("cy", cupY);
  cupStem.setAttribute("y", cupY);
  cupStem.setAttribute("height", Math.max(0, cupBaseY - cupY + 5).toString());

  vacuumAura.setAttribute("opacity", hasVacuum() ? "0.9" : "0");

  stateLabel.textContent = state;
  motorLabel.textContent = "motor: " + motorFromState();

  if (lastRenderedState !== state) {
    if (lastRenderedState && stateNodes[lastRenderedState])
      stateNodes[lastRenderedState].classList.remove("active");
    if (stateNodes[state]) stateNodes[state].classList.add("active");
    lastRenderedState = state;
  }
  document.getElementById("r-state").textContent = state;
  document.getElementById("r-motor").textContent = motorFromState();
  document.getElementById("r-arm").textContent = armPos.toFixed(1) + " / " + BOARD.toFixed(1);
  document.getElementById("r-fsr").textContent = fsr().toFixed(1) + "%";
  document.getElementById("bar-fsr").style.width = Math.min(100, fsr()) + "%";
  document.getElementById("r-cup").textContent = cupDeploy.toFixed(0) + "%";
  document.getElementById("bar-cup").style.width = cupDeploy + "%";
  document.getElementById("r-vac").textContent = vacuumLevel.toFixed(0) + "%";
  document.getElementById("bar-vac").style.width = vacuumLevel + "%";

  const setPill = (id, on, onText, offText) => {
    const el = document.getElementById(id);
    el.textContent = on ? onText : offText;
    el.classList.toggle("on", on);
    el.classList.toggle("off", !on);
  };
  setPill("pill-cup-sol", cupSolenoid, "SOL ON", "SOL OFF");
  setPill("pill-cup-pos", cupRaised(), "RAISED", "LOWERED");
  setPill("pill-vac-sol", vacSolenoid, "ON", "OFF");
  setPill("pill-vac-sw", hasVacuum(), "VACUUM", "NO VACUUM");
}

document.getElementById("btn-start").onclick = () => { startPending = true; };
document.getElementById("btn-stop").onclick  = () => { stopPending = true; };
document.getElementById("btn-reset").onclick = () => {
  armPos = 0; cupDeploy = 0; vacuumLevel = 0;
  cupSolenoid = false; vacSolenoid = false;
  atBoardTicks = 0; raisingTicks = 0; vacuumTicks = 0;
  state = "STOPPED"; prevState = "STOPPED";
  appendLog("--- reset ---");
};

render();
setInterval(step, TICK_MS);
</script>

</body>
</html>
